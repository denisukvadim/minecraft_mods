# Production stack: API + admin panel behind Traefik.
#
# Copy next to your deployment (or keep in the repo) and create a `.env` beside
# it — Compose reads it automatically. Required:
#
#   DOMAIN=example.com
#   DATABASE_URL=postgres://user:pass@postgres:5432/minecraft_mods
#   JWT_SECRET=<at least 32 characters>
#   PORTAINER_URL=https://portainer.example.com:9443
#   PORTAINER_API_KEY=ptr_...
#   MC_CONTAINER=minecraftserver
#
# Optional: NAME, PORT, ADMIN_NAME, ADMIN_PORT, CORS_ORIGINS, ADMIN_*,
# MODS_UID/MODS_GID, MODS_MAX_UPLOAD_BYTES, CLIENT_MAX_BODY_SIZE, image tags.
#
# The mods directory is bind-mounted at the same absolute path inside the
# container, so MODS_DIR can stay the host path and the Minecraft container can
# mount it too.

name: minecraft-mods

services:
  api:
    image: ${API_IMAGE:-ghcr.io/denisukvadim/minecraft_mods}:${API_TAG:-latest}
    restart: unless-stopped
    # Write files as the Minecraft server's uid/gid (itzg images usually 1000).
    user: '${MODS_UID:-1000}:${MODS_GID:-1000}'
    environment:
      HOST: 0.0.0.0
      PORT: '${PORT:-8080}'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_TTL_MINUTES: '${JWT_TTL_MINUTES:-60}'
      CORS_ORIGINS: '${CORS_ORIGINS:-*}'
      MODS_DIR: /home/veles/docker-config/minecraftserver/mods
      MODS_MAX_UPLOAD_BYTES: '${MODS_MAX_UPLOAD_BYTES:-134217728}'
      # Created only on an empty database; remove these from .env afterwards.
      ADMIN_EMAIL: '${ADMIN_EMAIL:-}'
      ADMIN_USERNAME: '${ADMIN_USERNAME:-}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      # Container control; without URL+key /server/* answer 503 and file
      # changes are not blocked while the server runs.
      PORTAINER_URL: '${PORTAINER_URL:-}'
      PORTAINER_API_KEY: '${PORTAINER_API_KEY:-}'
      PORTAINER_ENDPOINT_ID: '${PORTAINER_ENDPOINT_ID:-1}'
      MC_CONTAINER: '${MC_CONTAINER:-minecraftserver}'
      PORTAINER_VERIFY_TLS: '${PORTAINER_VERIFY_TLS:-true}'
      PORTAINER_TIMEOUT_SECS: '${PORTAINER_TIMEOUT_SECS:-15}'
      RUST_LOG: '${RUST_LOG:-info,tower_http=warn}'
    volumes:
      - /home/veles/docker-config/minecraftserver/mods:/home/veles/docker-config/minecraftserver/mods
    networks:
      - proxy
      - postgres
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.entrypoints=https'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.rule=Host(`${NAME:-minecraft-mods-api}.${DOMAIN}`)'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.tls=true'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.tls.certresolver=cloudflare'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.service=${NAME:-minecraft-mods-api}'
      - 'traefik.http.routers.${NAME:-minecraft-mods-api}.middlewares=default-headers@file'
      - 'traefik.http.services.${NAME:-minecraft-mods-api}.loadbalancer.server.port=${PORT:-8080}'
      - 'traefik.http.services.${NAME:-minecraft-mods-api}.loadbalancer.passHostHeader=true'
      - 'traefik.http.services.${NAME:-minecraft-mods-api}.loadbalancer.healthcheck.path=/health'
      - 'traefik.http.services.${NAME:-minecraft-mods-api}.loadbalancer.healthcheck.interval=10s'

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/denisukvadim/minecraft_mods_admin}:${ADMIN_TAG:-latest}
    restart: unless-stopped
    environment:
      # The panel proxies /api and /docs internally, so the API name is enough.
      BACKEND_URL: 'http://api:${PORT:-8080}'
      # nginx body limit for uploads proxied to the API. Keep it >= the API's
      # MODS_MAX_UPLOAD_BYTES, or the panel answers 413 before the backend can.
      CLIENT_MAX_BODY_SIZE: '${CLIENT_MAX_BODY_SIZE:-128m}'
    depends_on:
      - api
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.entrypoints=https'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.rule=Host(`${ADMIN_NAME:-minecraft-mods-admin}.${DOMAIN}`)'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.tls=true'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.tls.certresolver=cloudflare'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.service=${ADMIN_NAME:-minecraft-mods-admin}'
      - 'traefik.http.routers.${ADMIN_NAME:-minecraft-mods-admin}.middlewares=default-headers@file'
      - 'traefik.http.services.${ADMIN_NAME:-minecraft-mods-admin}.loadbalancer.server.port=${ADMIN_PORT:-80}'
      - 'traefik.http.services.${ADMIN_NAME:-minecraft-mods-admin}.loadbalancer.passHostHeader=true'
      - 'traefik.http.services.${ADMIN_NAME:-minecraft-mods-admin}.loadbalancer.healthcheck.path=/'
      - 'traefik.http.services.${ADMIN_NAME:-minecraft-mods-admin}.loadbalancer.healthcheck.interval=10s'

networks:
  proxy:
    external: true
  postgres:
    external: true
    name: postgress_postgres
